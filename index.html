<!doctype html>
<html lang="en" id="top">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      rel="icon"
      href="src/assets/favicon/THE MET.svg"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com"
    crossorigin="anonymous">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">
    <title>The Metropolitan Museum of Art</title>
    <link
      rel="stylesheet"
      href="src/styles/index.scss"
    />
    <script
      src="src/scripts/main.js"
      defer
    ></script>
  </head>
  <body>
    <header class="header">
      <div class="header__content">
        <img
          class="header__content__logo"
          src="src/assets/favicon/THE MET.svg"
          alt="The Metropolitan Museum of Art logo"
          href="#top"
        />
        <div class="header__content__info">
          <p class="header__content__info__tooltip">THE MET FIFTH AVENUE<br> +1 212-535-7710<br>THE MET CLOISTERS<br> +1 212-923-3700</p>
          <button class="header__content__info__phone">
            <img
            src="src/assets/images/icons/Icon-Phone-call.svg"
            alt="The Metropolitan Museum of Art phone icon"
          />
          </button>
          <button class="header__content__info__menu"></button>
        </div>
      </div>

      <div class="header__menu">
        <div class="header__menu__top">
          <img class="header__menu__top__logo"
            src="src/assets/favicon/THE MET.svg"
            alt="The Metropolitan Museum of Art logo"
            href="#top"
          />
          <button class="header__menu__top__close">
            <img
              src="src/assets/images/icons/Icon-Close.svg"
              alt="close icon button"
            />
          </button>

        </div>
        <nav class="header__menu__nav">
          <ul class="header__menu__nav__list">
            <li class="header__menu__nav__list__item">home</li>
            <li class="header__menu__nav__list__item">about us</li>
            <li class="header__menu__nav__list__item">now on view</li>
            <li class="header__menu__nav__list__item">testimonials</li>
            <li class="header__menu__nav__list__item">contacts</li>
          </ul>
        </nav>
        <div class="header__menu__adress">
          <p>the met fifth avenue <br> +1 212-535-7710</p>
          <p>the met cloisters <br> +1 212-923-3700</p>
        </div>
        <button class="header__menu__order">call to order</button>

      </div>
    </header>

    <section class="hero">
      <div class="hero__title">
        <h1 class="hero__title__align">Welcome<br>to the MET</h1>
      </div>
    </section>
  </body>
</html>
